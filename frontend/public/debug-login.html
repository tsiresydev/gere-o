<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Connexion de démonstration</title>
  </head>
  <body>
    <p id="status">Connexion…</p>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      if (token) {
        localStorage.setItem('gere-o.accessToken', token);
        window.location.replace('/dashboard');
      } else {
        document.getElementById('status').textContent = 'Jeton manquant.';
      }
    </script>
  </body>
</html>
